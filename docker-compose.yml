name: standalone-ssh-mcp
services:
  ssh-mcp:
    build: .
    restart: unless-stopped
    ports:
      - "${WEB_BIND_IP:-127.0.0.1}:9099:9099"
    environment:
      DATA_DIR: /app/data
      TZ: Asia/Shanghai
    volumes:
      - ssh_mcp_data:/app/data
    healthcheck:
      test: ["CMD","python","-c","import urllib.request; urllib.request.urlopen('http://127.0.0.1:9099/healthz',timeout=3)"]
      interval: 20s
      timeout: 5s
      retries: 4
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
volumes:
  ssh_mcp_data:
