name: SSH MCP 验证
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        python: ["3.11", "3.12"]
    steps:
      - name: 拉取源码
        uses: actions/checkout@v4
      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: 安装依赖
        run: python -m pip install -r requirements-dev.txt
      - name: 静态检查
        run: |
          ruff check --select F401,F811,F821,F841 sshmcp tests examples
          ruff format --check sshmcp tests examples
          python -m compileall -q sshmcp tests examples
          node --check web/app.js
          node --check web/setup.js
          node --check web/inventory.js
          node --check web/interactions.js
          node --check web/presentation.js
          /bin/sh -n gateway/aiops-diagnostic-gateway
      - name: 接口、权限与真实 SSH 协议回归
        run: python -m pytest -q
  desktop:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements-dev.txt
      - name: 安装 Chromium 与中文字体
        run: |
          python -m playwright install --with-deps chromium
          sudo apt-get install -y fonts-noto-cjk
      - name: 三种桌面宽度、关键交互与 MCP 客户端联调
        run: python tests/browser_smoke.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: desktop-evidence
          path: |
            docs/UI-TEST-RESULTS.json
            docs/screenshots/*.png
            /tmp/sshmcp-browser-test.log
  container:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 构建非 root 镜像
        run: docker build -t ssh-mcp-server:ci .
      - name: 启动、鉴权、持久化与重启验证
        run: python tests/container_smoke.py
