name: SSH MCP 基础验证
on:
  push:
    branches: [main]
  pull_request:
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - name: 拉取源码
        uses: actions/checkout@v4
      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: 安装依赖
        run: python -m pip install -r requirements.txt pytest httpx
      - name: Python 语法检查
        run: python -m compileall -q sshmcp tests
      - name: JavaScript 语法检查
        run: node --check web/app.js
      - name: 执行单元与接口测试
        run: python -m pytest -q
      - name: Docker 构建
        run: docker build -t ssh-mcp-server:ci .
